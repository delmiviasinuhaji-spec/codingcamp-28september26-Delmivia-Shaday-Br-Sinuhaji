<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">💰 Budget Tracker</h1>
      <button id="themeToggle" class="btn-icon" aria-label="Toggle dark/light mode" title="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="container">

    <!-- Balance Card -->
    <section class="balance-card" aria-label="Total balance">
      <p class="balance-label">Total Spent</p>
      <p class="balance-amount" id="totalBalance">$0.00</p>
    </section>

    <!-- Two-column grid on wider screens -->
    <div class="main-grid">

      <!-- LEFT: Form + Category Manager -->
      <div class="left-panel">

        <!-- Add Transaction Form -->
        <section class="card">
          <h2 class="section-title">Add Transaction</h2>
          <form id="transactionForm" novalidate>
            <div class="form-group">
              <label for="itemName">Item Name</label>
              <input type="text" id="itemName" placeholder="e.g. Coffee" maxlength="60" autocomplete="off" />
              <span class="field-error" id="nameError"></span>
            </div>

            <div class="form-group">
              <label for="itemAmount">Amount ($)</label>
              <input type="number" id="itemAmount" placeholder="0.00" min="0.01" step="0.01" />
              <span class="field-error" id="amountError"></span>
            </div>

            <div class="form-group">
              <label for="itemCategory">Category</label>
              <select id="itemCategory">
                <!-- Options injected by JS -->
              </select>
              <span class="field-error" id="categoryError"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">+ Add Transaction</button>
          </form>
        </section>

        <!-- Custom Category Manager -->
        <section class="card">
          <h2 class="section-title">Manage Categories</h2>
          <div class="category-manager">
            <div class="category-input-row">
              <input type="text" id="newCategoryInput" placeholder="New category name" maxlength="30" autocomplete="off" />
              <button id="addCategoryBtn" class="btn btn-secondary">Add</button>
            </div>
            <span class="field-error" id="categoryAddError"></span>
            <div id="categoryChips" class="category-chips" aria-label="Category list"></div>
          </div>
        </section>

      </div>

      <!-- RIGHT: Chart + Transaction List -->
      <div class="right-panel">

        <!-- Pie Chart -->
        <section class="card chart-card">
          <h2 class="section-title">Spending by Category</h2>
          <div class="chart-wrapper">
            <canvas id="spendingChart" aria-label="Spending pie chart" role="img"></canvas>
            <p class="chart-empty" id="chartEmpty">No data yet. Add a transaction!</p>
          </div>
        </section>

        <!-- Transaction List -->
        <section class="card">
          <div class="list-header">
            <h2 class="section-title">Transactions</h2>
            <div class="sort-controls">
              <label for="sortSelect" class="sort-label">Sort by:</label>
              <select id="sortSelect" aria-label="Sort transactions">
                <option value="date-desc">Latest first</option>
                <option value="date-asc">Oldest first</option>
                <option value="amount-desc">Amount (High→Low)</option>
                <option value="amount-asc">Amount (Low→High)</option>
                <option value="category-asc">Category (A→Z)</option>
                <option value="category-desc">Category (Z→A)</option>
              </select>
            </div>
          </div>

          <ul id="transactionList" class="transaction-list" aria-label="Transaction list" aria-live="polite">
            <!-- Items injected by JS -->
          </ul>
          <p class="list-empty" id="listEmpty">No transactions yet.</p>
        </section>

      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
